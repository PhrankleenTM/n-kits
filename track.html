<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Track your N-KITS jersey order with your order number and WhatsApp phone number or email."
    />
    <meta
      name="keywords"
      content="track order, jersey order tracking, N-KITS tracking"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="/track" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="N-KITS" />
    <meta property="og:title" content="Track Order – N-KITS" />
    <meta
      property="og:description"
      content="Track your N-KITS jersey order with your order number and WhatsApp phone number or email."
    />
    <meta property="og:url" content="/track" />
    <meta
      property="og:image"
      content="/assets/logo/logo-dusk-transparent.png"
    />
    <meta property="og:image:alt" content="N-KITS" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="/track" />
    <meta name="twitter:title" content="Track Order – N-KITS" />
    <meta
      name="twitter:description"
      content="Track your N-KITS jersey order with your order number and WhatsApp phone number or email."
    />
    <meta
      name="twitter:image"
      content="/assets/logo/logo-dusk-transparent.png"
    />
    <meta name="theme-color" content="#2E2A4A" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "/#organization",
            "name": "N-KITS",
            "description": "Retro football jerseys for club and country, with custom names and numbers."
          },
          {
            "@type": "WebSite",
            "@id": "/#website",
            "url": "/",
            "name": "N-KITS",
            "publisher": { "@id": "/#organization" }
          },
          {
            "@type": "WebPage",
            "@id": "/track#webpage",
            "url": "/track",
            "name": "Track Order – N-KITS",
            "isPartOf": { "@id": "/#website" }
          }
        ]
      }
    </script>
    <title>Track Order – N-KITS</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/theme.js"></script>
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <a href="/" class="logo" aria-label="N-KITS home">
          <img
            class="logo-img logo-img--light"
            src="assets/logo/logo-dusk-transparent.png"
            alt="N-KITS"
          />
          <img
            class="logo-img logo-img--dark"
            src="assets/logo/logo-lavender-transparent.png"
            alt="N-KITS"
          />
        </a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/shop">Shop</a>
          <a href="/custom">Custom</a>
        </nav>
        <div class="header-actions">
          <a href="/cart" class="icon-btn" aria-label="Cart">
            <svg viewBox="0 0 24 24">
              <path d="M6 6h15l-1.5 9h-12z" />
              <circle cx="9" cy="20" r="1" />
              <circle cx="18" cy="20" r="1" />
              <path d="M6 6L5 3H2" />
            </svg>
            <span class="cart-badge" style="display: none">0</span>
          </a>
          <button
            type="button"
            class="icon-btn theme-toggle"
            data-theme-toggle
            aria-label="Switch theme"
            title="Switch theme"
          >
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41-1.41M12 2v2M17.66 6.34l1.41-1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 17.66l1.41 1.41"
              />
            </svg>
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24">
              <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <button
            type="button"
            class="mobile-menu-btn"
            onclick="toggleMobileMenu()"
            aria-label="Menu"
          >
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="mobile-nav" onclick="toggleMobileMenu()">
      <div class="mobile-nav-inner" onclick="event.stopPropagation()">
        <a href="/">Home</a>
        <a href="/shop">Shop All</a>
        <a href="/custom">Custom</a>
        <a href="/cart">Cart</a>
        <a href="/track">Track order</a>
      </div>
    </div>

    <main class="section">
      <div class="container">
        <button type="button" class="back-btn" onclick="goBack('/shop')">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" /></svg>
          Back
        </button>
        <h1 class="section-title">Track order</h1>

        <div class="track-card">
          <p class="track-hint">
            Enter your order number and the WhatsApp number or email you used at
            checkout.
          </p>
          <form id="track-form" novalidate>
            <div class="track-form-grid">
              <div class="form-group">
                <label for="track-order">Order number</label>
                <input
                  type="text"
                  id="track-order"
                  inputmode="numeric"
                  placeholder="1042"
                  autocomplete="off"
                  required
                />
              </div>
              <div class="form-group">
                <label for="track-match">Phone or email</label>
                <input
                  type="text"
                  id="track-match"
                  placeholder="0801 234 5678 or you@example.com"
                  autocomplete="email"
                  required
                />
              </div>
            </div>
            <p id="track-error" class="track-error" hidden></p>
            <button
              type="submit"
              class="btn btn-primary btn-block"
              id="track-submit"
            >
              Track order
            </button>
          </form>
          <p class="track-hint">
            Only matching orders are shown. Repeated failed attempts are
            temporarily limited.
          </p>
        </div>

        <div id="track-result" class="track-card" hidden>
          <h2 id="track-heading"></h2>
          <p id="track-status" class="track-status"></p>
          <p id="track-date" class="text-muted"></p>
          <p id="track-delivery" class="track-hint"></p>
          <div id="track-items" class="track-lines"></div>
          <div class="track-actions">
            <a href="/shop" class="btn btn-primary">Continue shopping</a>
            <button type="button" class="btn btn-secondary" id="track-another">
              Check another order
            </button>
            <a href="#" class="btn btn-ghost" id="track-help"
              >Ask on WhatsApp</a
            >
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <span>© 2026 N-KITS</span>
          <a href="/track">Track order</a>
        </div>
      </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pages/track.js"></script>
  </body>
</html>
