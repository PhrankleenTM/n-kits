<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin – N-KITS</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/admin.css" />
    <script src="js/theme.js"></script>
  </head>
  <body class="admin-body">
    <!-- ============ LOGIN GATE ============ -->
    <div class="admin-auth" id="admin-auth">
      <div class="auth-card">
        <div class="admin-auth-brand">
          <a href="index.html" class="logo" aria-label="N-KITS home">
            <img
              class="logo-img logo-img--light"
              src="assets/logo/logo-dusk-transparent.png"
              alt="N-KITS"
            />
            <img
              class="logo-img logo-img--dark"
              src="assets/logo/logo-lavender-transparent.png"
              alt="N-KITS"
            />
          </a>
          <span class="admin-tag">Admin</span>
        </div>
        <h1>Admin panel</h1>
        <p class="subtitle" id="auth-subtitle">
          Sign in with your admin account
        </p>

        <div class="form-error" id="auth-error" style="display: none"></div>

        <form id="admin-login-form">
          <div class="form-group" id="group-email">
            <label>Email</label>
            <input
              type="email"
              name="email"
              required
              placeholder="admin@example.com"
              autocomplete="username"
            />
          </div>
          <div class="form-group" id="group-password">
            <label>Password</label>
            <input
              type="password"
              name="password"
              required
              placeholder="••••••••"
              autocomplete="current-password"
            />
          </div>
          <div class="form-group" id="group-local" style="display: none">
            <label>Admin password</label>
            <input
              type="password"
              name="local"
              required
              placeholder="Local admin password"
              autocomplete="current-password"
            />
          </div>
          <button
            type="submit"
            class="btn btn-primary btn-block"
            style="padding: 14px; margin-top: 8px"
          >
            Sign in
          </button>
        </form>

        <p class="auth-footer" id="auth-hint"></p>
        <p class="auth-footer"><a href="index.html">← Back to store</a></p>
      </div>
    </div>

    <!-- ============ APP SHELL ============ -->
    <div class="admin-shell" id="admin-shell" style="display: none">
      <aside class="admin-sidebar" id="admin-sidebar">
        <div class="admin-brand">
          <a href="index.html" class="logo" aria-label="N-KITS home">
            <img
              class="logo-img logo-img--light"
              src="assets/logo/logo-dusk-transparent.png"
              alt="N-KITS"
            />
            <img
              class="logo-img logo-img--dark"
              src="assets/logo/logo-lavender-transparent.png"
              alt="N-KITS"
            />
          </a>
          <span class="admin-tag">Admin</span>
        </div>
        <nav class="admin-nav">
          <a href="#/dashboard" data-nav="dashboard">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <rect x="14" y="14" width="7" height="7" rx="1" />
            </svg>
            Dashboard
          </a>
          <a href="#/jerseys" data-nav="jerseys">
            <svg viewBox="0 0 24 24">
              <path d="M6 3l3 2h6l3-2 4 4-3 3v11H5V10L2 7z" />
            </svg>
            Jerseys
          </a>
          <a href="#/categories" data-nav="categories">
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
            Categories
          </a>
          <a href="#/orders" data-nav="orders">
            <svg viewBox="0 0 24 24">
              <path d="M6 6h15l-1.5 9h-12z" />
              <circle cx="9" cy="20" r="1" />
              <circle cx="18" cy="20" r="1" />
              <path d="M6 6L5 3H2" />
            </svg>
            Orders
          </a>
          <a href="#/settings" data-nav="settings">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"
              />
            </svg>
            Settings
          </a>
        </nav>
        <div class="admin-side-footer">
          <span class="mode-badge" id="mode-badge">…</span>
          <a class="admin-link" href="index.html">← View store</a>
          <button
            type="button"
            class="admin-link admin-logout-btn"
            id="admin-logout-btn"
          >
            Log out
          </button>
        </div>
      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <button
            type="button"
            class="mobile-menu-btn admin-menu-btn"
            id="admin-menu-btn"
            aria-label="Menu"
          >
            <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
          </button>
          <button
            type="button"
            class="icon-btn theme-toggle"
            data-theme-toggle
            aria-label="Switch theme"
            title="Switch theme"
          >
            <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24">
              <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
            </svg>
          </button>
          <h1 id="admin-title">Dashboard</h1>
          <div class="admin-user" id="admin-user"></div>
        </header>

        <div class="admin-banner" id="admin-banner" style="display: none"></div>

        <main class="admin-content" id="admin-view"></main>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/data.js"></script>
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
