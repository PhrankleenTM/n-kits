<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop – N-KITS</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo" aria-label="N-KITS home">
        <img class="logo-img logo-img--light" src="assets/logo/logo-dusk-transparent.png" alt="N-KITS">
        <img class="logo-img logo-img--dark" src="assets/logo/logo-lavender-transparent.png" alt="N-KITS">
      </a>
        <nav class="nav">
          <a href="index.html">Home</a>
          <a href="shop.html" class="active">Shop</a>
          <a href="custom.html">Custom</a>
        </nav>
      <div class="header-actions">
        <a href="cart.html" class="icon-btn" aria-label="Cart">
          <svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M6 6L5 3H2"/></svg>
          <span class="cart-badge" style="display:none">0</span>
        </a>
        <button type="button" class="icon-btn theme-toggle" data-theme-toggle aria-label="Switch theme" title="Switch theme">
          <svg class="theme-icon theme-icon--sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="theme-icon theme-icon--moon" viewBox="0 0 24 24"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-nav" onclick="toggleMobileMenu()">
    <div class="mobile-nav-inner" onclick="event.stopPropagation()">
        <a href="index.html">Home</a>
        <a href="shop.html">Shop All</a>
        <a href="custom.html">Custom</a>
        <a href="cart.html">Cart</a>
      <a href="track.html">Track order</a>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <button type="button" class="back-btn" onclick="goBack('index.html')">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        Back
      </button>

      <div id="custom-banner" class="custom-banner" hidden>
        <div>
          <strong>Custom jerseys</strong>
          <span>Pick a jersey, then add a name, a number, or both at checkout.</span>
        </div>
        <span class="custom-fee" id="custom-fee-label"></span>
      </div>

      <h1 class="section-title">All jerseys</h1>
      <p class="text-muted" style="margin-bottom: 24px">Browse club, country, and fan-favorite kits. Filter by category or price to find your fit.</p>

      <div class="shop-layout">
        <div class="mobile-filters">
          <div class="mobile-filter">
            <label for="cat-select">Type</label>
            <select id="cat-select" onchange="setCategory(this.value)"></select>
          </div>
          <div class="mobile-filter">
            <label for="price-select">Price</label>
            <select id="price-select" onchange="setPrice(this.value)">
              <option value="all">All</option>
              <option value="under80">Under ₦80,000</option>
              <option value="80to90">₦80k – ₦90k</option>
              <option value="over90">Over ₦90,000</option>
            </select>
          </div>
        </div>

        <aside class="filters">
          <div class="filter-group">
            <h3>Category</h3>
            <div id="cat-filters"></div>
          </div>
          <div class="filter-group">
            <h3>Price</h3>
            <label class="filter-option"><input type="radio" name="price" value="all" checked onchange="setPrice(this.value)"> All</label>
            <label class="filter-option"><input type="radio" name="price" value="under80" onchange="setPrice(this.value)"> Under ₦80,000</label>
            <label class="filter-option"><input type="radio" name="price" value="80to90" onchange="setPrice(this.value)"> ₦80k – ₦90k</label>
            <label class="filter-option"><input type="radio" name="price" value="over90" onchange="setPrice(this.value)"> Over ₦90,000</label>
          </div>
        </aside>

        <div>
          <div class="shop-header">
            <select class="sort-select" id="sort" onchange="applyFilters()">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
            </select>
          </div>
          <div class="product-grid" id="shop-products"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© 2026 N-KITS</span>
        <a href="track.html">Track order</a>
      </div>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages/shop.js"></script>
</body>
</html>
